<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gajian SD-IT QA</title>
    <script>
      (function () {
        var RECOVERY_KEY = 'payedu_asset_recovery_ts';
        function recoverStaleAssets() {
          if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
          try {
            var last = Number(sessionStorage.getItem(RECOVERY_KEY) || 0);
            if (Date.now() - last < 15000) return;
            sessionStorage.setItem(RECOVERY_KEY, String(Date.now()));
          } catch (err) {}

          Promise.resolve()
            .then(function () {
              if ('serviceWorker' in navigator) {
                return navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
                });
              }
            })
            .then(function () {
              if ('caches' in window) {
                return caches.keys().then(function (names) {
                  return Promise.all(names.map(function (name) { return caches.delete(name); }));
                });
              }
            })
            .catch(function () {})
            .finally(function () {
              window.location.reload();
            });
        }

        window.addEventListener('error', function (event) {
          var target = event && event.target;
          if (!target || (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK')) return;
          var url = target.src || target.href || '';
          if (url.indexOf('/assets/') !== -1) {
            recoverStaleAssets();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
